version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omino-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: omino
      POSTGRES_PASSWORD: omino_dev_password
      POSTGRES_DB: omino
    volumes:
      - omino_pg_data:/var/lib/postgresql/data

volumes:
  omino_pg_data:
