<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMINO</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500;125,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500&family=Zain:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/omino.css">
<style>
.app{
  min-height:100svh;
  background:var(--ink);
  color:var(--paper);
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:120px max(24px, env(safe-area-inset-right)) max(64px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
}
.app-inner{max-width:520px;width:100%;margin:0 auto;min-width:0;}
.app-mark{width:56px;height:56px;margin-bottom:32px;}
.app-mark img{width:100%;height:100%;object-fit:contain;}
.app h1{font-size:clamp(1.85rem,6vw,3rem);line-height:1.15;color:var(--paper);overflow-wrap:break-word;}
.app .meta{margin-top:16px;color:#A8ADB3;overflow-wrap:anywhere;}
.app-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px;}
.app-actions .btn{height:auto;}
.on-dark .btn-ghost{border-color:var(--hairline-dark);}
@media(max-width:480px){
  .app{padding-top:96px;}
  .app-actions .btn{flex:1 1 100%;}
}
</style>
</head>
<body class="on-dark">
<a class="skip" href="#hello" id="skipLink">Skip to content</a>
<main class="app">
  <div class="app-inner">
    <div class="app-mark"><img src="img/omino-mark-paper.png" alt="" width="240" height="244"></div>
    <p class="idx" id="kicker">AI Business OS</p>
    <h1 id="hello">You are inside OMINO.</h1>
    <p class="meta" id="meta"></p>
    <div class="app-actions">
      <a class="btn btn-primary" href="index.html" id="backBtn">Back to OMINO</a>
      <button type="button" class="btn btn-ghost" id="signOut">Sign out</button>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const s = OminoAuth.session();
if(!s) location.replace('login.html');
else {
  const ar = localStorage.getItem('omino-lang') === 'ar';
  document.documentElement.lang = ar ? 'ar' : 'en';
  document.documentElement.dir = ar ? 'rtl' : 'ltr';
  document.title = ar ? 'OMINO — حسابك' : 'OMINO';
  document.getElementById('skipLink').textContent = ar ? 'تخطي إلى المحتوى' : 'Skip to content';
  document.getElementById('kicker').textContent = ar ? 'نظام تشغيل الأعمال' : 'AI Business OS';
  document.getElementById('hello').textContent = ar ? 'أنت داخل OMINO.' : 'You are inside OMINO.';
  document.getElementById('meta').textContent = [s.fullname, s.business, s.email].filter(Boolean).join(' · ');
  document.getElementById('backBtn').textContent = ar ? 'العودة إلى OMINO' : 'Back to OMINO';
  document.getElementById('signOut').textContent = ar ? 'خروج' : 'Sign out';
}
document.getElementById('signOut').addEventListener('click', ()=>{
  OminoAuth.signOut();
  location.href = 'login.html';
});
</script>
</body>
</html>
